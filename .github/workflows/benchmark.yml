name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'nimnet.nimble'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'nimnet.nimble'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache choosenim and nimble
        uses: actions/cache@v6
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: ${{ runner.os }}-${{ runner.arch }}-nim-stable-${{ hashFiles('nimnet.nimble') }}

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'benchmarks/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r benchmarks/requirements.txt
          nimble install -y

      - name: Run equivalent benchmarks sequentially
        env:
          BENCH_RUNS: "3"
        run: bash benchmarks/run_benchmarks.sh

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/results/*.csv
            benchmarks/results/metadata.json
            benchmarks/results/fixtures/*.json
