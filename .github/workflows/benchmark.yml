name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache choosenim and nimble
        uses: actions/cache@v5
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: ${{ runner.os }}-nim-stable-v3

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'benchmarks/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r benchmarks/requirements.txt &
          nimble install -y &
          wait

      - name: Compile NimNet benchmark
        run: nim c -d:release -d:danger -d:ciBenchRuns --opt:speed -p:src -o:build/bench_nimnet benchmarks/bench_nimnet.nim

      - name: Run benchmarks in parallel
        env:
          BENCH_RUNS: "3"
        run: |
          ./build/bench_nimnet > results_nimnet.csv &
          PID_NIM=$!
          python benchmarks/bench_networkx.py > results_networkx.csv &
          PID_PY=$!
          wait $PID_NIM $PID_PY
          echo "=== NimNet Results ==="
          cat results_nimnet.csv
          echo ""
          echo "=== NetworkX Results ==="
          cat results_networkx.csv

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results_nimnet.csv
            results_networkx.csv
