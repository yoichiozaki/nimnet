name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run tests with coverage
        run: |
          for test in ttypes tgraph tdigraph talgorithms_core talgorithms_io_gen talgorithms_extended; do
            nim c --passC:--coverage --passL:--coverage -r -p:src --nimcache:build/nimcache/$test tests/$test.nim
          done

      - name: Collect coverage data
        run: |
          lcov --capture --directory build/nimcache --output-file coverage_raw.info --ignore-errors inconsistent,gcov
          # Keep only project source files, exclude stdlib and test files
          lcov --extract coverage_raw.info "$(pwd)/src/*" --output-file coverage.info --ignore-errors unused || true
          if [ ! -s coverage.info ]; then
            cp coverage_raw.info coverage.info
          fi
          lcov --list coverage.info || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
