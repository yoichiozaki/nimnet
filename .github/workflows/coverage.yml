name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run tests with coverage
        run: nimble coverage_tests

      - name: Collect coverage data
        run: |
          lcov --capture --directory build/nimcache_cov --output-file coverage_raw.info \
            --ignore-errors inconsistent,gcov,mismatch --rc geninfo_unexecuted_blocks=1
          lcov --extract coverage_raw.info "$(pwd)/src/*" --output-file coverage.info
          test -s coverage.info
          lcov --summary coverage.info

      - name: Validate coverage and generate badge
        run: python tools/coverage_badge.py coverage.info docs/badges/coverage.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          fail_ci_if_error: false

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: |
            coverage.info
            docs/badges/coverage.json

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Save badge JSON before switching branches
          cp docs/badges/coverage.json /tmp/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Push to a separate 'badges' branch to avoid main branch protection
          git checkout --orphan badges
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p docs/badges
          cp /tmp/coverage.json docs/badges/coverage.json
          git add docs/badges/coverage.json
          git commit -m "ci: update coverage badge [skip ci]"
          git push origin badges --force
