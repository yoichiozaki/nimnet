name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache choosenim and nimble
        uses: actions/cache@v5
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: ${{ runner.os }}-nim-stable-v3

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache nimcache
        uses: actions/cache@v5
        with:
          path: build/nimcache
          key: ${{ runner.os }}-nimcache-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim') }}
          restore-keys: |
            ${{ runner.os }}-nimcache-

      - name: Install dependencies
        run: nimble install -y

      - name: Lint check
        run: nim check --threads:on -p:src --hints:off src/nimnet.nim

      - name: Compile tests
        run: nimble build_tests

      - name: Run tests
        run: nimble run_tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache choosenim and nimble
        uses: actions/cache@v5
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: Linux-nim-stable-v3

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Run tests with coverage
        run: |
          mkdir -p build coverage
          for testfile in tests/t*.nim; do
            testname=$(basename "$testfile" .nim)
            nim c --threads:on -p:src \
              --passC:--coverage --passL:--coverage \
              --nimcache:build/nimcache_cov/"$testname" \
              -o:build/"$testname" "$testfile"
            ./build/"$testname" || true
          done

      - name: Collect coverage
        run: |
          lcov --capture --directory build/nimcache_cov \
            --output-file coverage/lcov.info \
            --ignore-errors inconsistent,gcov,source,empty,mismatch \
            --rc geninfo_unexecuted_blocks=1 || true
          if [ -f coverage/lcov.info ] && [ -s coverage/lcov.info ]; then
            lcov --remove coverage/lcov.info '/usr/*' '*/choosenim/*' '*/nimble/*' \
              --output-file coverage/lcov_filtered.info \
              --ignore-errors inconsistent,unused,empty || true
          else
            echo "No coverage data collected"
            touch coverage/lcov_filtered.info
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov_filtered.info
          fail_ci_if_error: false
