name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.nim == 'stable' && format('test ({0})', matrix.os) || format('test ({0}, Nim {1})', matrix.os, matrix.nim) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim: ['stable']
        include:
          - os: ubuntu-latest
            nim: '2.0.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache choosenim and nimble
        uses: actions/cache@v6
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: ${{ runner.os }}-${{ runner.arch }}-nim-${{ matrix.nim }}-${{ hashFiles('nimnet.nimble') }}

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record compiler version
        id: compiler
        shell: bash
        run: |
          version=$(nim --version | sed -n '1s/.*Version \([^ ]*\).*/\1/p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache nimcache
        uses: actions/cache@v6
        with:
          path: build/nimcache
          key: ${{ runner.os }}-${{ runner.arch }}-nimcache-${{ steps.compiler.outputs.version }}-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'benchmarks/*.nim', 'nimnet.nimble') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nimcache-${{ steps.compiler.outputs.version }}-

      - name: Install dependencies
        run: nimble install -y

      - name: Verify requested compiler is still selected
        shell: bash
        env:
          REQUESTED_NIM: ${{ matrix.nim }}
        run: |
          actual=$(nim --version | sed -n '1s/.*Version \([^ ]*\).*/\1/p')
          if [[ "$REQUESTED_NIM" != stable && "$actual" != "$REQUESTED_NIM" ]]; then
            echo "Expected Nim $REQUESTED_NIM, got $actual" >&2
            exit 1
          fi

      - name: Lint check
        run: nim check --threads:on -p:src --hints:off src/nimnet.nim

      - name: Compile tests
        run: nimble build_tests

      - name: Run tests
        run: nimble run_tests

      - name: Run public API documentation example
        run: nim c -r --threads:on --hints:off -p:src --nimcache:build/nimcache/library_improvements -o:build/library_improvements examples/library_improvements.nim

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test benchmark and coverage tooling
        run: python -m unittest discover -s tests -p test_tooling.py -v

      - name: Build API documentation without diagnostics
        if: matrix.os == 'ubuntu-latest' && matrix.nim == 'stable'
        run: nimble docs
