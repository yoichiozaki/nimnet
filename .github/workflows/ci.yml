name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache choosenim and nimble
        uses: actions/cache@v5
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: ${{ runner.os }}-nim-stable-v3

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache nimcache
        uses: actions/cache@v5
        with:
          path: build/nimcache
          key: ${{ runner.os }}-nimcache-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim') }}
          restore-keys: |
            ${{ runner.os }}-nimcache-

      - name: Install dependencies
        run: nimble install -y

      - name: Compile tests
        run: nimble build_tests

      - name: Run tests
        run: nimble run_tests
