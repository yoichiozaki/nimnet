name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache Nim toolchain and packages
        id: cache-nim
        uses: actions/cache@v5
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: ${{ runner.os }}-nim-stable-v2

      - uses: jiro4989/setup-nim-action@v2
        if: steps.cache-nim.outputs.cache-hit != 'true'
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Nim to PATH (cache hit)
        if: steps.cache-nim.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          for dir in "$HOME/.choosenim/toolchains"/nim-*/bin; do
            [ -d "$dir" ] && echo "$dir" >> $GITHUB_PATH
          done

      - name: Cache nimcache
        uses: actions/cache@v5
        with:
          path: build/nimcache
          key: ${{ runner.os }}-nimcache-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim') }}
          restore-keys: |
            ${{ runner.os }}-nimcache-

      - name: Install dependencies
        run: nimble install -y

      - name: Compile tests
        run: nimble build_tests

      - name: Run tests
        run: nimble run_tests
